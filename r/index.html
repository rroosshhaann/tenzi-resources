<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Redirecting…</title>
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter Tight', Inter, system-ui, -apple-system, sans-serif;
    background: #faf8f4;
    color: #6b6560;
    font-size: 14px;
    text-align: center;
    padding: 60px 24px;
    -webkit-font-smoothing: antialiased;
  }
  p { margin: 0; }
  a { color: #2ca471; text-decoration: none; }
</style>
</head>
<body>
<p id="msg">Redirecting…</p>
<script>
// Static click-tracking redirect for the Tenzi newsletter. Hits the same
// Apps Script doGet endpoint as the rest of the site (writes one row to
// the Events sheet) and then navigates the visitor to ?to=. Lives on
// resources.tenzi.ai instead of script.google.com so the visitor never
// sees the Apps Script iframe wrapper or its Google banner.
(function () {
  var ENDPOINT = 'https://script.google.com/macros/s/AKfycbzO6crfhklS6kIOXOGNIBBSk9ZiIUdM1lESOw6hGkqfE7qxz9MbVz47_ydAitFyFQtW/exec';
  // Mirrors apps-script.gs ALLOWED_REDIRECT_HOSTS. Anchored regex so a
  // crafted URL like https://tenzi.ai.evil.com can't masquerade as tenzi.ai.
  var ALLOWED = /^https:\/\/(([a-z0-9-]+\.)*tenzi\.ai|([a-z0-9-]+\.)*linkedin\.com|([a-z0-9-]+\.)*cal\.com)([\/?#]|$)/i;

  var p = new URLSearchParams(window.location.search);
  var to = p.get('to') || '';
  var action = p.get('action') || 'email_click';
  var recipient = p.get('recipient') || '';
  var campaign = p.get('campaign') || '';

  if (!to || !ALLOWED.test(to)) {
    document.getElementById('msg').textContent = 'Redirect blocked.';
    return;
  }

  var beaconUrl = ENDPOINT
    + '?email=' + encodeURIComponent('(cta: ' + action + ')')
    + '&page=' + encodeURIComponent(campaign)
    + '&recipient=' + encodeURIComponent(recipient)
    + '&site=email';

  // Fire-and-forget. keepalive lets the request survive the upcoming
  // navigation; Image() is the fallback for older browsers without fetch.
  try {
    if (typeof fetch === 'function') {
      fetch(beaconUrl, { keepalive: true, mode: 'no-cors' }).catch(function () {});
    } else {
      new Image().src = beaconUrl;
    }
  } catch (e) {
    new Image().src = beaconUrl;
  }

  window.location.replace(to);
})();
</script>
<noscript>
<p>JavaScript is required to complete this redirect.</p>
</noscript>
</body>
</html>
